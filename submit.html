<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Lançar Emergencial · Manutenção</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--s1:#0d1018;--s3:#1a1f2d;--s4:#21273a;
  --border:rgba(255,255,255,.055);--border2:rgba(255,255,255,.11);
  --gold:#c49a3c;--gold2:#ddb84e;
  --text:#e8e9ec;--muted:#7a8094;--muted2:#9ba0b0;
  --danger:#e5484d;--ok:#2ea043;
}
body{font-family:'Jost',sans-serif;background:linear-gradient(135deg,#07090f 0%,#0d1018 100%);color:var(--text);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;font-size:13px}
.card{width:100%;max-width:440px;background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:24px;color:var(--gold2);margin-bottom:4px;display:flex;align-items:center;gap:10px}
.subtitle{font-size:11px;color:var(--muted);margin-bottom:20px;letter-spacing:.5px}
.badge-emrg{display:inline-flex;align-items:center;gap:6px;background:rgba(229,72,77,.13);border:1px solid rgba(229,72,77,.35);color:#ff7a7e;padding:7px 13px;border-radius:8px;font-size:12px;font-weight:500;margin-bottom:18px}
.field{margin-bottom:14px}
label{display:block;font-size:10px;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;font-weight:500;margin-bottom:6px}
input,select,textarea{width:100%;background:var(--s4);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:80px;font-family:inherit;line-height:1.5}
.req{color:var(--danger)}
.btn{width:100%;background:linear-gradient(135deg,var(--gold) 0%,#a87f2a 100%);color:#1a1408;border:none;border-radius:8px;padding:13px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.5px;margin-top:6px;transition:transform .1s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:14px;padding:12px;border-radius:8px;font-size:12px;line-height:1.5;display:none}
.msg.show{display:block}
.msg.ok{background:rgba(46,160,67,.13);border:1px solid rgba(46,160,67,.35);color:#7ee787}
.msg.err{background:rgba(229,72,77,.13);border:1px solid rgba(229,72,77,.35);color:#ff7a7e}
.footer-note{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);font-size:10.5px;color:var(--muted);text-align:center;line-height:1.6}
.loader{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#1a1408;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
#mode-tabs{display:flex}
.modetab{flex:1;background:var(--s4);border:1px solid var(--border2);color:var(--muted2);padding:9px;border-radius:8px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s}
.modetab.active{background:rgba(196,154,60,.16);border-color:rgba(196,154,60,.5);color:var(--gold2)}
.trip-item{display:block;width:100%;text-align:left;background:var(--s4);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;margin-bottom:8px;color:var(--text);font-family:inherit;font-size:12.5px;cursor:pointer;transition:all .15s;line-height:1.6}
.trip-item:hover{border-color:var(--gold)}
.trip-item.sel{border-color:var(--gold);background:rgba(196,154,60,.13)}
.trip-num{font-weight:700;color:var(--gold2)}
.locked-info{background:var(--s4);border:1px solid var(--border);border-radius:8px;padding:11px 13px;font-size:12px;line-height:1.8;color:var(--muted2);margin-bottom:14px}
.locked-info b{color:var(--text)}
.and-srv{background:var(--s4);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:8px;padding:11px 13px;margin-bottom:8px}
.and-srv-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.and-srv-top b{font-size:14px;color:var(--text)}
.and-srv-tipo{font-size:10.5px;color:var(--muted2);white-space:nowrap}
.and-srv-serv{font-size:11px;color:var(--gold2);margin-top:3px;font-weight:600}
.and-srv-desc{font-size:12px;color:var(--muted2);margin-top:5px;line-height:1.5}
.and-srv-meta{font-size:10.5px;color:var(--muted);margin-top:6px}
.and-srv.and-novo{border-left-color:var(--danger);background:rgba(229,72,77,.06)}
.and-srv.and-novo .and-srv-tipo{color:#ff7a7e;font-weight:600}
.and-done{margin-top:10px;width:100%;background:rgba(46,160,67,.14);border:1px solid rgba(46,160,67,.4);color:#7ee787;padding:8px;border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s}
.and-done:hover{background:rgba(46,160,67,.24)}
.and-conf{margin-top:10px;background:rgba(46,160,67,.1);border:1px dashed rgba(46,160,67,.45);color:#7ee787;padding:8px 10px;border-radius:8px;font-size:11px;line-height:1.4}
.foto-thumb{display:block;max-width:100%;max-height:180px;border-radius:8px;border:1px solid var(--border);margin-top:8px;object-fit:cover}
.foto-remove{margin-top:6px;background:none;border:1px solid var(--border2);color:var(--muted2);font-family:inherit;font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer}
.foto-info{font-size:10.5px;color:var(--muted);margin-top:4px}
.and-foto{display:block;max-width:140px;max-height:110px;border-radius:8px;border:1px solid var(--border);margin-top:8px;object-fit:cover}
</style>
</head>
<body>

<div class="card">
  <h1>⚡ Novo Emergencial</h1>
  <div class="subtitle" id="subtitle">Reportar serviço emergencial</div>

  <div id="top-tabs" style="display:none;gap:6px;margin-bottom:16px">
    <button class="modetab active" id="ttab-rep" onclick="switchTop('rep')">＋ Reportar</button>
    <button class="modetab" id="ttab-and" onclick="switchTop('and')">⟳ Em Andamento</button>
  </div>

  <div id="mode-tabs" style="display:none;gap:6px;margin-bottom:16px">
    <button class="modetab active" id="tab-open" onclick="setMode('open')">Abrir</button>
    <button class="modetab" id="tab-abast" onclick="setMode('abast')">Abastecimento</button>
    <button class="modetab" id="tab-fim" onclick="setMode('fim')">Finalizar</button>
  </div>

  <div id="open-view">
  <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap">
    <span class="badge-emrg">⚡ Emergencial</span>
  </div>

  <div class="field" id="field-setor" style="display:none">
    <label>Setor que está reportando <span class="req">*</span></label>
    <select id="f-setor">
      <option value="Recepção">Recepção</option>
      <option value="Manutenção">Manutenção</option>
      <option value="Governança / ASG">Governança / ASG</option>
      <option value="Cozinha">Cozinha</option>
      <option value="Restaurante / Bar">Restaurante / Bar</option>
      <option value="Outro">Outro</option>
    </select>
  </div>

  <div class="field">
    <label>Quarto / Área <span class="req">*</span></label>
    <input id="f-area" placeholder="ex: UH15, COZINHA, PISCINA…" autocomplete="off">
  </div>

  <div class="field">
    <label>Serviço <span class="req">*</span></label>
    <select id="f-serv"></select>
  </div>

  <div class="field">
    <label>Descrição <span class="req">*</span></label>
    <textarea id="f-desc" placeholder="Descreva o serviço..."></textarea>
  </div>

  <div class="field" id="field-foto">
    <label>Foto (opcional)</label>
    <input id="f-foto" type="file" accept="image/*" capture="environment" onchange="onFotoChange()">
    <div id="foto-preview"></div>
  </div>

  <div class="field">
    <label>Prioridade</label>
    <select id="f-prio">
      <option value="ALTA">🔴 Alta</option>
      <option value="MEDIA" selected>🟠 Média</option>
      <option value="BAIXA">🔵 Baixa</option>
    </select>
  </div>

  <div class="field">
    <label>Reportado por / Funcionários</label>
    <input id="f-func" placeholder="ex: ANDRE, EDINHO…" autocomplete="off">
  </div>

  <div class="field">
    <label>Data Identificado</label>
    <input id="f-dtid" type="date">
  </div>

  <div class="field">
    <label>Data Início</label>
    <input id="f-ini" type="date">
  </div>

  <div class="field" id="field-kmini" style="display:none">
    <label>KM Inicial</label>
    <input id="f-kmini" type="number" inputmode="numeric" placeholder="ex: 45120">
  </div>

  <div class="field" id="field-pax" style="display:none">
    <label>Quantidade de Passageiros</label>
    <input id="f-pax" type="number" inputmode="numeric" placeholder="ex: 3">
  </div>

  <div class="field" id="field-abast" style="display:none">
    <label>Abastecimento</label>
    <input id="f-abast" placeholder="ex: tanque cheio, R$100, 30L…">
  </div>

  <div class="field" id="field-fim" style="display:none">
    <label>Prazo / Data Fim</label>
    <input id="f-fim" type="date">
  </div>

  <button class="btn" id="btn-send" onclick="enviar()">Enviar</button>

  <div class="msg" id="msg"></div>
  </div>

  <div id="fim-view" style="display:none">
    <div class="field">
      <label>Carro <span class="req">*</span></label>
      <select id="fim-car" onchange="onFimCarChange()"><option value="">Selecione o carro…</option></select>
    </div>
    <div class="field">
      <label>Viagens em aberto</label>
      <div id="fim-trips"></div>
    </div>
    <div id="fim-detail" style="display:none">
      <div class="locked-info" id="fim-locked"></div>
      <div class="field">
        <label>Código da viagem <span class="req">*</span></label>
        <input id="fim-codigo" inputmode="numeric" placeholder="código de 4 dígitos" autocomplete="off">
      </div>
      <div class="field">
        <label>KM Final <span class="req">*</span></label>
        <input id="fim-kmfinal" type="number" inputmode="numeric" placeholder="ex: 45380">
      </div>
      <button class="btn" id="fim-btn" onclick="finalizarViagem()">Finalizar viagem</button>
      <div class="msg" id="fim-msg"></div>
    </div>
  </div>

  <div id="abast-view" style="display:none">
    <div class="field">
      <label>Carro <span class="req">*</span></label>
      <select id="ab-car" onchange="onAbCarChange()"><option value="">Selecione o carro…</option></select>
    </div>
    <div class="field">
      <label>Viagens em aberto</label>
      <div id="ab-trips"></div>
    </div>
    <div id="ab-detail" style="display:none">
      <div class="locked-info" id="ab-locked"></div>
      <div class="field">
        <label>Litros <span class="req">*</span></label>
        <input id="ab-litros" type="number" inputmode="decimal" step="0.01" placeholder="ex: 32,5" autocomplete="off">
      </div>
      <div class="field">
        <label>Valor (R$) <span class="req">*</span></label>
        <input id="ab-valor" type="number" inputmode="decimal" step="0.01" placeholder="ex: 180,00" autocomplete="off">
      </div>
      <div class="field">
        <label>Posto / Observação</label>
        <input id="ab-abast" placeholder="ex: Posto Ipiranga, tanque cheio…" autocomplete="off">
      </div>
      <button class="btn" id="ab-btn" onclick="salvarAbast()">Salvar abastecimento</button>
      <div class="msg" id="ab-msg"></div>
    </div>
  </div>

  <div id="and-view" style="display:none">
    <div class="locked-info" style="margin-bottom:12px" id="and-note">👁 Somente leitura. Estes são os serviços <b>em andamento</b> desta unidade. Apenas a supervisão pode alterar.</div>
    <div id="and-list"><div style="color:var(--muted);font-size:12px">Carregando…</div></div>
  </div>

  <div class="footer-note">
    Após o envio, apenas a supervisão pode alterar ou excluir o registro.
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const FIREBASE_CFG = {
  apiKey: "AIzaSyD5iD_RrPkfSW4_cgMbysEFKDpDh5_4i80",
  authDomain: "hotel-manutencao.firebaseapp.com",
  databaseURL: "https://hotel-manutencao-default-rtdb.firebaseio.com",
  projectId: "hotel-manutencao",
  storageBucket: "hotel-manutencao.firebasestorage.app",
  messagingSenderId: "368535658005",
  appId: "1:368535658005:web:5759f188a29710f7db781c"
};
const DEFAULT_SERVICOS = ['REPAROS','LIMPEZA','AR','LAMPADA','TV','PINTURA','INSTALAÇÃO','VIDROS','OBRA','ELETRICA','REFRIGEREÇÃO','CHUVEIRO','REFORMA','MANUTENÇÃO','TELEFONE','JARDIM'];
const CARROS_SERVICOS = ['REVISÃO','TROCA DE ÓLEO','PNEUS','FREIOS','SUSPENSÃO','ALINHAMENTO','FUNILARIA','PINTURA','ELÉTRICA','AR CONDICIONADO','BATERIA','MECÂNICA','LAVAGEM','VIDROS','ABASTECIMENTO','LICENCIAMENTO','SEGURO','MULTAS'];
const ASG_SERVICOS = ['LIMPEZA','ARRUMAÇÃO','LAVANDERIA','JARDIM','LIXO','PISCINA','ÁREA COMUM','BANHEIROS','VIDROS','ROÇAGEM','DEDETIZAÇÃO','MANUTENÇÃO'];
const MONTHS_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const HOTELS = {
  'costa_sol':       { name: 'Costa do Sol',    path: 'hotel_manutencao' },
  'brava_club':      { name: 'Brava Club',      path: 'hotels/brava_club' },
  'brava_exclusive': { name: 'Brava Exclusive', path: 'hotels/brava_exclusive' },
  'vila_pitanga':    { name: 'Vila Pitanga',    path: 'hotels/vila_pitanga' },
  'maria_maria':     { name: 'Maria Maria',     path: 'hotels/maria_maria' },
  'carros':          { name: 'Carros',          path: 'hotels/carros', emrgOne: 'Viagem', icon: '🚗' },
};
const params = new URLSearchParams(window.location.search);
const hotelKey = HOTELS[params.get('h')] ? params.get('h') : 'costa_sol';
const HOTEL = HOTELS[hotelKey];
const T = params.get('t');
const isGeral = T === 'geral';
const TIPO = T === 'plan' ? 'PLANEJADO' : T === 'asg' ? 'ASG' : 'EMERGENCIAL';
const isPlan = TIPO === 'PLANEJADO';
const isAsg = TIPO === 'ASG';

// App Firebase SEPARADO ("publico") para o link não derrubar a sessão da conta técnica do sistema
// (o app principal usa a instância padrão; aqui usamos uma instância isolada, anônima e sem persistência).
const fbApp = firebase.initializeApp(FIREBASE_CFG, 'publico');
const db = firebase.database(fbApp);
const pubAuth = firebase.auth(fbApp);
try { pubAuth.setPersistence(firebase.auth.Auth.Persistence.NONE); } catch (e) {}
const authReady = pubAuth.signInAnonymously().catch(e => console.error('Falha no login anônimo:', e));

let headIcon, headLabel;
if (hotelKey === 'carros') {
  headIcon  = isPlan ? '🔧' : '🚗';
  headLabel = isPlan ? 'Serviço' : 'Viagem';
} else if (isGeral) {
  headIcon  = '📣';
  headLabel = 'Informe';
} else if (isAsg) {
  headIcon  = '🧹';
  headLabel = 'Serviço ASG';
} else {
  headIcon  = isPlan ? '📋' : '⚡';
  headLabel = isPlan ? 'Serviço Planejado' : 'Emergencial';
}
document.title = `${isGeral ? 'Informe' : 'Lançar ' + headLabel} · ${HOTEL.name}`;
document.querySelector('h1').innerHTML = `${headIcon} ${isGeral ? 'Novo Informe' : 'Novo ' + headLabel}`;
document.getElementById('subtitle').textContent = `🏨 ${HOTEL.name} · ${isGeral ? 'Relato para a supervisão' : 'Reportar ' + headLabel.toLowerCase()}`;
document.querySelector('.badge-emrg').textContent = `${headIcon} ${headLabel}`;

// Abas Reportar / Em Andamento (unidades de hotel)
if (hotelKey !== 'carros') {
  document.getElementById('top-tabs').style.display = 'flex';
  const fl = document.getElementById('f-func').previousElementSibling;
  if (fl) fl.textContent = 'Reportado por (quem identificou)';
}
// Link geral: escolher o setor, sem serviço (a supervisão classifica ao aceitar)
if (isGeral) {
  document.getElementById('field-setor').style.display = '';
  const servField = document.getElementById('f-serv').parentElement;
  if (servField) servField.style.display = 'none';
  const funcLbl = document.getElementById('f-func').previousElementSibling;
  if (funcLbl) funcLbl.firstChild ? funcLbl.textContent = 'Reportado por' : null;
  const prioField = document.getElementById('f-prio').parentElement;
  if (prioField) {
    const h = document.createElement('div');
    h.style.cssText = 'font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.4';
    h.textContent = 'Prioridade Alta é enviada direto ao manutentor. Média e Baixa aguardam a supervisão.';
    prioField.appendChild(h);
  }
}

function genId() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ── FOTO (Cloudinary) ──
const CLOUDINARY = { cloud: 'gjdetk7j', preset: 'meridiana_fotos' };
let fotoBlob = null;
function onFotoChange() {
  const f = document.getElementById('f-foto').files[0];
  const prev = document.getElementById('foto-preview');
  fotoBlob = null; prev.innerHTML = '';
  if (!f) return;
  comprimirImagem(f, 1280, 0.7).then(blob => {
    fotoBlob = blob;
    const url = URL.createObjectURL(blob);
    prev.innerHTML = `<img src="${url}" class="foto-thumb"><button type="button" class="foto-remove" onclick="removerFoto()">✕ remover foto</button><div class="foto-info">Pronta para enviar (${Math.round(blob.size/1024)} KB)</div>`;
  }).catch(e => { console.error(e); prev.innerHTML = '<div class="foto-info" style="color:#ff7a7e">Não foi possível ler a imagem.</div>'; });
}
function removerFoto() {
  fotoBlob = null;
  document.getElementById('f-foto').value = '';
  document.getElementById('foto-preview').innerHTML = '';
}
function comprimirImagem(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > h) { if (w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; } }
      else { if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; } }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(b => b ? resolve(b) : reject(new Error('falha')), 'image/jpeg', quality);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadFoto(blob) {
  const fd = new FormData();
  fd.append('file', blob);
  fd.append('upload_preset', CLOUDINARY.preset);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloud}/image/upload`, { method: 'POST', body: fd });
  if (!r.ok) throw new Error('upload falhou');
  const j = await r.json();
  return j.secure_url;
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show ' + type;
}
function clearMsg() { document.getElementById('msg').className = 'msg'; }

document.getElementById('f-dtid').value = new Date().toISOString().split('T')[0];

const VIAGEM_DESTINOS = ['PRAIA DOS OSSOS','PRAIA DA FERRADURA','PRAIA','JOÃO FERNANDES','CENTRO','COMPRAS'];
const CARROS_VEICULOS  = ['PARTNER','SPRINTER','Q7','RANGER','BMW'];
const CARROS_GERADORES = ['GERADOR BC','GERADOR CS'];
function nowHM() { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
let VEH_ALL = [...CARROS_VEICULOS];
let GER_ALL = [...CARROS_GERADORES];
const fixedCar = (params.get('car') || '').trim().toUpperCase();

function rebuildArea(current) {
  const aSel = document.getElementById('f-area');
  if (!aSel || aSel.tagName !== 'SELECT') return;
  const list = isPlan ? [...VEH_ALL, ...GER_ALL] : VEH_ALL;
  const labelBranco = isPlan ? 'Selecione o automotor…' : 'Selecione o carro…';
  aSel.innerHTML = `<option value="">${labelBranco}</option>` + list.map(v => `<option value="${v}">${v}</option>`).join('') + `<option value="__ADD__">➕ Adicionar (admin)…</option>`;
  aSel.value = (current && list.includes(current)) ? current : '';
}
function fillCarSelects() {

function currentMonthName() {
  const d = new Date();
  return `${MONTHS_PT[d.getMonth()]} ${d.getFullYear()}`;
}

async function enviar() {
  clearMsg();
  await authReady;
  const area = document.getElementById('f-area').value.trim();
  const desc = document.getElementById('f-desc').value.trim();
  const serv = isGeral ? '' : document.getElementById('f-serv').value;
  const setor = isGeral ? document.getElementById('f-setor').value : '';

  if (isGeral && !setor) { showMsg('⚠ Selecione o setor.', 'err'); return; }
  if (!area) { showMsg('⚠ Selecione o carro / preencha a área.', 'err'); return; }
  if (hotelKey === 'carros' && !isPlan && !serv) { showMsg('⚠ Selecione o destino.', 'err'); return; }
  if (!desc && !(hotelKey === 'carros' && !isPlan)) { showMsg('⚠ Descreva o serviço.', 'err'); return; }

  const btn = document.getElementById('btn-send');
  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span>Enviando...';

  try {
    let fotoUrl = '';
    if (fotoBlob) {
      btn.innerHTML = '<span class="loader"></span>Enviando foto...';
      try { fotoUrl = await uploadFoto(fotoBlob); } catch (e) { console.error('foto:', e); }
      btn.innerHTML = '<span class="loader"></span>Enviando...';
    }
    const snap = await db.ref(HOTEL.path).once('value');
    const val = snap.val() || {};
    let months = Array.isArray(val.months) ? [...val.months] : [];
    let data   = Array.isArray(val.data)   ? val.data.map(m => Array.isArray(m) ? [...m] : []) : [];

    let targetIdx;
    const curName = currentMonthName();
    const existing = months.indexOf(curName);
    if (existing >= 0) {
      targetIdx = existing;
    } else if (months.length > 0) {
      targetIdx = months.length - 1;
    } else {
      months = [curName];
      data = [[]];
      targetIdx = 0;
    }
    while (data.length <= targetIdx) data.push([]);

    const isViagem = hotelKey === 'carros' && !isPlan;
    if (isViagem) {
      let aberta = null;
      data.forEach(m => (m || []).forEach(rr => {
        if (rr.tipo === 'EMERGENCIAL' && rr.area === area && !(rr.kmFim === 0 || rr.kmFim)) aberta = rr;
      }));
      if (aberta) {
        showMsg(`⚠ O carro ${area} já tem a Viagem ${String(aberta.num || 0).padStart(3,'0')} em aberto. Finalize-a (informe o KM final) antes de abrir outra.`, 'err');
        return;
      }
    }
    let viagemNum = null, viagemCod = null;
    if (isViagem) {
      let maxN = 0;
      data.forEach(m => (m || []).forEach(rr => { if (rr.tipo === 'EMERGENCIAL' && typeof rr.num === 'number' && rr.num > maxN) maxN = rr.num; }));
      viagemNum = maxN + 1;
      viagemCod = String(1000 + Math.floor(Math.random() * 9000));
    }

    const novo = {
      id: genId(),
      tipo: TIPO,
      prio: document.getElementById('f-prio').value,
      area,
      serv,
      desc,
      stat: isViagem ? 'ANDAMENTO' : (isGeral && document.getElementById('f-prio').value === 'ALTA') ? 'ANDAMENTO' : 'INDENTIFICADO',
      func: (hotelKey === 'carros') ? document.getElementById('f-func').value.trim() : '',
      dtid: document.getElementById('f-dtid').value,
      ini:  (hotelKey === 'carros' && !isPlan) ? document.getElementById('f-dtid').value : document.getElementById('f-ini').value,
      fim:  isPlan ? document.getElementById('f-fim').value : '',
      origem: 'form-publico',
      pendente: true,
      ts: Date.now()
    };
    if (isGeral) novo.setor = setor;
    if (fotoUrl) novo.foto = fotoUrl;
    if (hotelKey !== 'carros') novo.ident = document.getElementById('f-func').value.trim();
    if (isViagem) {
      novo.num = viagemNum;
      novo.codigo = viagemCod;
      novo.kmIni = document.getElementById('f-kmini').value;
      novo.kmFim = '';
      novo.pax = document.getElementById('f-pax').value;
      novo.abast = '';
      novo.hIni = nowHM();
    }

    data[targetIdx].unshift(novo);

    await db.ref(HOTEL.path).update({ months, data });

    if (isViagem) {
      const msgEl = document.getElementById('msg');
      msgEl.className = 'msg show ok';
      msgEl.innerHTML = `✓ <b>Viagem ${String(viagemNum).padStart(3,'0')}</b> aberta!<br>Código para finalizar: <b style="font-size:17px;letter-spacing:3px">${viagemCod}</b><br><span style="color:var(--muted)">Guarde este código. Você vai precisar dele para informar o KM final ao voltar.</span>`;
    } else {
      showMsg('✓ Enviado com sucesso! O registro foi lançado.', 'ok');
    }
    const areaEl = document.getElementById('f-area');
    if (areaEl.tagName === 'SELECT') areaEl.selectedIndex = 0; else areaEl.value = '';
    document.getElementById('f-desc').value = '';
    document.getElementById('f-func').value = '';
    document.getElementById('f-ini').value = '';
    if (document.getElementById('f-fim')) document.getElementById('f-fim').value = '';
    document.getElementById('f-prio').value = 'MEDIA';
    document.getElementById('f-serv').selectedIndex = 0;
    removerFoto();
    ['f-kmini','f-pax','f-abast'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; });
    document.getElementById('f-dtid').value = new Date().toISOString().split('T')[0];
  } catch (e) {
    console.error(e);
    showMsg('❌ Erro ao enviar. Verifique a conexão e tente novamente.', 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Enviar';
  }
}

async function sha256(str) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
async function onServChange() {
  const sel = document.getElementById('f-serv');
  if (sel.value !== '__ADD__') return;
  sel.selectedIndex = 0;
  const isDest = !isPlan;
  const node = isDest ? 'destinos' : 'servicos';
  const base = isDest ? VIAGEM_DESTINOS : CARROS_SERVICOS;
  const nome = (prompt(isDest ? 'Novo destino:' : 'Novo serviço:') || '').trim().toUpperCase().normalize('NFC');
  if (!nome) return;
  const senha = (prompt('Senha master (admin) para adicionar:') || '').trim();
  if (!senha) return;
  try {
    await authReady;
    const ms = await db.ref('config/masterPin').once('value');
    if (!ms.val() || (await sha256(senha)) !== ms.val()) { alert('Senha master incorreta.'); return; }
    const snap = await db.ref(`${HOTEL.path}/${node}`).once('value');
    const cur = Array.isArray(snap.val()) ? snap.val() : [];
    if (!cur.includes(nome) && !base.includes(nome)) {
      cur.push(nome);
      await db.ref(`${HOTEL.path}/${node}`).set(cur);
    }
    if (!SERV_ALL.includes(nome)) SERV_ALL.push(nome);
    fillServ(nome);
    alert('"' + nome + '" adicionado.');
  } catch (e) { console.error(e); alert('Erro ao adicionar. Tente novamente.'); }
}

async function prefillKm(car) {
  const f = document.getElementById('f-kmini');
  if (!car || car === '__ADD__') { if (f) f.value = ''; return; }
  try {
    await authReady;
    const snap = await db.ref(HOTEL.path).once('value');
    const val = snap.val() || {};
    const data = Array.isArray(val.data) ? val.data : [];
    // KM inicial sugerido = KM final da ULTIMA viagem do carro (maior numero de viagem).
    // Usar o "maior KM" seria fragil: um erro de digitacao antigo ficaria travado.
    let best = null, bestKey = -Infinity;
    data.forEach(m => (m || []).forEach(r => {
      if (r.tipo === 'EMERGENCIAL' && r.area === car) {
        const kf = parseFloat(r.kmFim);
        if (isFinite(kf)) {
          const key = (typeof r.num === 'number' ? r.num * 1e13 : 0) + (r.tsFim || r.ts || 0);
          if (key > bestKey) { bestKey = key; best = r; }
        }
      }
    }));
    if (f) f.value = best ? best.kmFim : '';
  } catch (e) { console.error(e); }
}

function fmtBRsub(s) {
  if (!s) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : s;
}

  if (!isFinite(kf)) { setM('Informe o KM final.', 'err'); return; }
  if (isFinite(ki) && kf < ki) { setM(`KM final não pode ser menor que o KM inicial (${fimSel.kmIni}).`, 'err'); return; }
  const btn = document.getElementById('fim-btn');
  btn.disabled = true; btn.innerHTML = '<span class="loader"></span>Salvando...';

    let found = false;
    data.forEach(m => m.forEach(r => { if (r.id === fimSel.id) { r.kmFim = kmf; r.stat = 'CONCLUIDO'; r.hFim = nowHM(); found = true; } }));

    await db.ref(HOTEL.path).update({ data });

    console.error(e);
    setM('Erro ao salvar. Tente novamente.', 'err');

}

    await authReady;
    const snap = await db.ref(HOTEL.path).once('value');
    const val = snap.val() || {};
    const data = Array.isArray(val.data) ? val.data : [];
    const months = Array.isArray(val.months) ? val.months : [];
    // Só o mês atual (serviços em andamento são copiados para meses seguintes; evita duplicar).
    let mi = months.indexOf(currentMonthName());
    if (mi < 0) mi = months.length - 1;
    const monthData = (mi >= 0 && Array.isArray(data[mi])) ? data[mi] : [];
    // Emergencial (manutentor) e Geral veem todos os tipos; Planejado e ASG só o próprio tipo.
    const showAll = (TIPO === 'EMERGENCIAL') || isGeral;
    const tipoNome = TIPO === 'PLANEJADO' ? 'planejados' : TIPO === 'ASG' ? 'de ASG' : '';
    const note = document.getElementById('and-note');
    if (note) note.innerHTML = showAll
      ? '👁 Somente leitura. <b>Todos os serviços em andamento</b> desta unidade. Apenas a supervisão pode alterar.'
      : `👁 Somente leitura. Serviços <b>${tipoNome} em andamento</b> desta unidade. Apenas a supervisão pode alterar.`;
    const rows = [];
    monthData.forEach(r => {
      const st = (r.stat || '').toUpperCase();
      if (!st.includes('AND') || st.includes('CONC')) return;
      if (!showAll && r.tipo !== TIPO) return;
      rows.push(r);
    });
    // Recebidos ainda não confirmados (novos) aparecem primeiro.
    rows.sort((a, b) => (b.pendente ? 1 : 0) - (a.pendente ? 1 : 0) || (b.ts || 0) - (a.ts || 0));
    if (!rows.length) { el.innerHTML = '<div style="color:var(--muted);font-size:12px">Nenhum serviço em andamento no momento.</div>'; return; }
    const tipoLabel = t => t === 'PLANEJADO' ? '📋 Planejado' : t === 'ASG' ? '🧹 ASG' : '⚡ Emergencial';
    el.innerHTML = rows.map(r => `<div class="and-srv${r.pendente ? ' and-novo' : ''}">
      <div class="and-srv-top"><b>${esc(r.area) || '—'}</b><span class="and-srv-tipo">${r.pendente ? ('🆕 Recebido' + (r.setor ? ' · ' + esc(r.setor) : '')) : tipoLabel(r.tipo)}</span></div>
      ${r.serv ? `<div class="and-srv-serv">${esc(r.serv)}</div>` : ''}
      ${r.desc ? `<div class="and-srv-desc">${esc(r.desc)}</div>` : ''}
      ${(r.foto && /^https:\/\//.test(r.foto)) ? `<a href="${esc(r.foto)}" target="_blank" rel="noopener"><img class="and-foto" src="${esc(r.foto)}"></a>` : ''}
      <div class="and-srv-meta">${r.ident ? '🔎 ' + esc(r.ident) + ' · ' : ''}${r.func ? '👤 ' + esc(r.func) : ''}${r.ini ? (r.func || r.ident ? ' · ' : '') + '📅 ' + fmtBRsub(r.ini) : ''}</div>
      ${r.confMant
        ? '<div class="and-conf">✓ Você marcou como concluído. Aguardando conferência da supervisão.</div>'
        : `<button class="and-done" onclick="marcarConcluido('${r.id}')">✓ Concluí este serviço</button>`}
    </div>`).join('');
  } catch (e) { console.error(e); el.innerHTML = '<div style="color:#ff7a7e;font-size:12px">Erro ao consultar. Tente novamente.</div>'; }
}
async function marcarConcluido(id) {
  if (!confirm('Confirmar que este serviço foi concluído? A supervisão vai conferir e finalizar.')) return;
  try {
    await authReady;
    const snap = await db.ref(HOTEL.path).once('value');
    const val = snap.val() || {};
    const data = Array.isArray(val.data) ? val.data.map(m => Array.isArray(m) ? [...m] : []) : [];
    let found = false;
    data.forEach(m => m.forEach(r => { if (r.id === id) { r.confMant = true; r.confMantTs = Date.now(); found = true; } }));
    if (!found) { alert('Registro não encontrado (pode já ter sido finalizado).'); loadAndamento(); return; }
    await db.ref(HOTEL.path).update({ data });
    loadAndamento();
  } catch (e) { console.error(e); alert('Erro ao registrar. Tente novamente.'); }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) enviar();
});
</script>
